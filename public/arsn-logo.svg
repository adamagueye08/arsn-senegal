<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <!-- Define styles -->
  <defs>
    <style>
      .arsn-text { font-family: Arial, sans-serif; font-size: 72px; font-weight: bold; fill: #003D7A; letter-spacing: 2px; }
      .arsn-desc { font-family: Arial, sans-serif; font-size: 28px; font-weight: bold; fill: #000; line-height: 1.4; }
    </style>
  </defs>

  <!-- Orbit circle background (light blue) -->
  <ellipse cx="260" cy="200" rx="180" ry="160" fill="#C8E0F0" stroke="none"/>
  
  <!-- Orbit path (blue arcs) -->
  <path d="M 80 200 Q 80 60, 260 40 Q 440 20, 440 200" 
        fill="none" stroke="#4A7BA7" stroke-width="32" stroke-linecap="round"/>
  <path d="M 440 200 Q 440 340, 260 360 Q 80 380, 80 200" 
        fill="none" stroke="#5A8BBF" stroke-width="32" stroke-linecap="round"/>
  
  <!-- Orbit end dots -->
  <circle cx="50" cy="200" r="14" fill="#fff" stroke="#4A7BA7" stroke-width="3"/>
  <circle cx="470" cy="200" r="14" fill="#fff" stroke="#5A8BBF" stroke-width="3"/>
  
  <!-- ARSN Letters Background -->
  <text x="260" y="260" class="arsn-text" text-anchor="middle">ARSN</text>
  
  <!-- Nuclear symbol (replacing O in ARSN position) -->
  <!-- Outer circle blue -->
  <circle cx="320" cy="155" r="42" fill="#003D7A" stroke="none"/>
  <!-- Middle circle light blue -->
  <circle cx="320" cy="155" r="35" fill="#B0D4E8" stroke="none"/>
  <!-- Inner circles for nuclear symbol -->
  <circle cx="320" cy="155" r="20" fill="#003D7A" stroke="none"/>
  <circle cx="320" cy="155" r="12" fill="#FFD700" stroke="none"/>
  <!-- Dots around nuclear symbol (Senegal flag colors) -->
  <circle cx="305" cy="140" r="5" fill="#FFD700"/>
  <circle cx="335" cy="140" r="5" fill="#00A651"/>
  <circle cx="320" cy="175" r="5" fill="#FF0000"/>
  
  <!-- Text description -->
  <text x="700" y="140" class="arsn-desc">AUTORITÉ SÉNÉGALAISE</text>
  <text x="700" y="185" class="arsn-desc">DE RADIOPROTECTION</text>
  <text x="700" y="230" class="arsn-desc">DE SÛRETÉ ET DE SÉCURITÉ</text>
  <text x="700" y="275" class="arsn-desc">NUCLÉAIRES</text>
</svg>