<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <!-- Define gradients and styles -->
  <defs>
    <style>
      .arsn-text { font-family: Arial, sans-serif; font-size: 72px; font-weight: bold; fill: #000; letter-spacing: 2px; }
      .arsn-desc { font-family: Arial, sans-serif; font-size: 36px; font-weight: bold; fill: #000; line-height: 1.3; }
    </style>
  </defs>

  <!-- Orbit circle (light blue) -->
  <circle cx="280" cy="200" r="180" fill="#D4E8F0" stroke="none"/>
  
  <!-- Orbit path (blue arc) -->
  <path d="M 100 200 Q 100 80, 280 60 Q 460 40, 460 200 Q 460 360, 280 340 Q 100 320, 100 200" 
        fill="none" stroke="#4A7BA7" stroke-width="35" stroke-linecap="round"/>
  
  <!-- Orbit dots -->
  <circle cx="70" cy="200" r="12" fill="#fff" stroke="#4A7BA7" stroke-width="3"/>
  <circle cx="490" cy="200" r="12" fill="#fff" stroke="#4A7BA7" stroke-width="3"/>
  
  <!-- ARSN Letters -->
  <text x="280" y="250" class="arsn-text" text-anchor="middle">ARSN</text>
  
  <!-- Nuclear symbol inside O -->
  <circle cx="315" cy="150" r="35" fill="#003366" stroke="none"/>
  <circle cx="315" cy="150" r="28" fill="#FFD700" stroke="none"/>
  <circle cx="315" cy="150" r="15" fill="#FF4444" stroke="none"/>
  <circle cx="305" cy="135" r="4" fill="#FFD700"/>
  <circle cx="325" cy="135" r="4" fill="#FFD700"/>
  <circle cx="315" cy="165" r="4" fill="#FFD700"/>
  
  <!-- Text description -->
  <text x="700" y="160" class="arsn-desc">AUTORITÉ SÉNÉGALAISE</text>
  <text x="700" y="210" class="arsn-desc">DE RADIOPROTECTION</text>
  <text x="700" y="260" class="arsn-desc">DE SÛRETÉ ET DE SÉCURITÉ</text>
  <text x="700" y="310" class="arsn-desc">NUCLÉAIRES</text>
</svg>